services:
  db:
    image: postgres:16-alpine
    container_name: concept-foundry-db
    environment:
      POSTGRES_USER: concept
      POSTGRES_PASSWORD: concept
      POSTGRES_DB: concept_foundry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concept -d concept_foundry"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: concept-foundry-api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://concept:concept@db:5432/concept_foundry
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
